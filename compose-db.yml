# Development database: Postgres only, for `bun run dev` and the tests on the host.
#   bun run db:up    starts it and creates inventory_test if it is missing
#   bun run db:down  stops it and keeps the data volume
# Matches DATABASE_URL in server/.env.example and server/test/.env.test.
# docker-compose.yml is the production-like stack. Both publish :5432, so run one at a time.
name: yuempuenma-dev

services:
  db:
    image: postgres:16-alpine
    container_name: yuempuenma-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yuempuenma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yuempuenma}
      POSTGRES_DB: ${POSTGRES_DB:-yuempuenma}
    ports:
      - "5432:5432"
    volumes:
      - pg_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_dev_data:
